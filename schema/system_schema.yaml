tables:
  - name: assistant_events
    description: "Events generated by Databricks Assistant usage (chat window and in-cell Assistant). Each row is a user message event."
    columns:
      - name: event_id
        type: TEXT
        description: "Unique ID for this assistant event."
      - name: account_id
        type: TEXT
        description: "ID of the Databricks account."
      - name: workspace_id
        type: TEXT
        description: "ID of the workspace where the assistant event occurred."
      - name: event_time
        type: TIMESTAMP
        description: "Timestamp when the assistant event happened (UTC)."
      - name: event_date
        type: TEXT
        description: "Date when the assistant event happened."
      - name: user_agent
        type: TEXT
        description: "Origination of the assistant request (browser or client)."
      - name: initiated_by
        type: TEXT
        description: "Email of the user initiating the assistant request."

  - name: audit
    description: "Audit log of account and workspace activities, capturing who did what, when, and from where."
    columns:
      - name: account_id
        type: TEXT
        description: "ID of the account."
      - name: workspace_id
        type: TEXT
        description: "ID of the workspace where the audited event occurred."
      - name: version
        type: TEXT
        description: "Audit log schema version."
      - name: event_time
        type: TIMESTAMP
        description: "Timestamp of the audited event (UTC)."
      - name: event_date
        type: TEXT
        description: "Calendar date when the action took place."
      - name: source_ip_address
        type: TEXT
        description: "IP address where the request originated."
      - name: user_agent
        type: TEXT
        description: "Origination of the request (HTTP user agent)."
      - name: session_id
        type: TEXT
        description: "ID of the session where the request came from."
      - name: user_identity
        type: TEXT
        description: "Serialized struct describing the identity of the user initiating the request."
      - name: service_name
        type: TEXT
        description: "Service name initiating the request (for example unityCatalog, apps)."
      - name: action_name
        type: TEXT
        description: "Category/type of the audited event (e.g. getTable, createTable, runCommand)."
      - name: request_id
        type: TEXT
        description: "Unique ID of the request."
      - name: request_params
        type: TEXT
        description: "Serialized map of request parameters (table names, commands, etc.)."
      - name: response
        type: TEXT
        description: "Serialized struct of response values (statusCode, errorMessage, etc.)."
      - name: audit_level
        type: TEXT
        description: "Workspace or account level event classification."
      - name: event_id
        type: TEXT
        description: "Unique ID of the audit event."
      - name: identity_metadata
        type: TEXT
        description: "Serialized struct of additional identities involved (run_by, run_as, etc.)."

  - name: clusters
    description: "Slow-changing dimension of compute configurations for all-purpose compute, jobs compute, and pipeline maintenance compute over time."
    columns:
      - name: account_id
        type: TEXT
        description: "ID of the account where this cluster was created."
      - name: workspace_id
        type: TEXT
        description: "ID of the workspace where this cluster was created."
      - name: cluster_id
        type: TEXT
        description: "ID of the cluster for this configuration record."
      - name: cluster_name
        type: TEXT
        description: "User-defined name of the cluster."
      - name: owned_by
        type: TEXT
        description: "Username of the cluster owner."
      - name: create_time
        type: TIMESTAMP
        description: "Timestamp when this compute configuration was created."
      - name: delete_time
        type: TIMESTAMP
        description: "Timestamp when the cluster was deleted (NULL if active)."
      - name: driver_node_type
        type: TEXT
        description: "Driver node type name (cloud instance type)."
      - name: worker_node_type
        type: TEXT
        description: "Worker node type name (cloud instance type)."
      - name: worker_count
        type: INTEGER
        description: "Number of workers for fixed-size clusters."
      - name: min_autoscale_workers
        type: INTEGER
        description: "Minimum number of workers for autoscaling clusters."
      - name: max_autoscale_workers
        type: INTEGER
        description: "Maximum number of workers for autoscaling clusters."
      - name: auto_termination_minutes
        type: INTEGER
        description: "Configured auto-termination duration in minutes."
      - name: enable_elastic_disk
        type: BOOLEAN
        description: "Whether autoscaling disk is enabled."
      - name: tags
        type: TEXT
        description: "Serialized map of user-defined tags (excluding default tags)."
      - name: cluster_source
        type: TEXT
        description: "Source of the cluster (UI, API, JOB, PIPELINE, PIPELINE_MAINTENANCE)."
      - name: init_scripts
        type: TEXT
        description: "Serialized list of init script paths."
      - name: aws_attributes
        type: TEXT
        description: "Serialized AWS-specific settings."
      - name: azure_attributes
        type: TEXT
        description: "Serialized Azure-specific settings."
      - name: gcp_attributes
        type: TEXT
        description: "Serialized GCP-specific settings."
      - name: driver_instance_pool_id
        type: TEXT
        description: "Instance pool ID for the driver, if applicable."
      - name: worker_instance_pool_id
        type: TEXT
        description: "Instance pool ID for workers, if applicable."
      - name: dbr_version
        type: TEXT
        description: "Databricks Runtime version for the cluster."
      - name: change_time
        type: TIMESTAMP
        description: "Timestamp of this config change."
      - name: change_date
        type: TEXT
        description: "Date of this config change (for retention)."
      - name: data_security_mode
        type: TEXT
        description: "Access mode of the compute resource (USER_ISOLATION, SINGLE_USER, legacy values, etc.)."
      - name: policy_id
        type: TEXT
        description: "ID of the cluster's compute policy, if applicable."

  - name: column_lineage
    description: "Column-level lineage events describing how source columns contribute to target columns across tables and paths."
    columns:
      - name: account_id
        type: TEXT
        description: "ID of the Databricks account."
      - name: metastore_id
        type: TEXT
        description: "ID of the Unity Catalog metastore."
      - name: workspace_id
        type: TEXT
        description: "ID of the workspace where the lineage event occurred."
      - name: entity_type
        type: TEXT
        description: "Type of entity associated with the lineage record (NOTEBOOK, JOB, PIPELINE, DASHBOARD_V3, DBSQL_DASHBOARD, DBSQL_QUERY, or NULL)."
      - name: entity_id
        type: TEXT
        description: "ID of the entity associated with the lineage record, or NULL."
      - name: entity_run_id
        type: TEXT
        description: "Unique run ID of the entity associated with the lineage record, or NULL."
      - name: source_table_full_name
        type: TEXT
        description: "Three-part name of the source table (catalog.schema.table)."
      - name: source_table_catalog
        type: TEXT
        description: "Catalog of the source table."
      - name: source_table_schema
        type: TEXT
        description: "Schema of the source table."
      - name: source_table_name
        type: TEXT
        description: "Name of the source table."
      - name: source_path
        type: TEXT
        description: "Cloud storage path of the source object."
      - name: source_type
        type: TEXT
        description: "Type of the source (TABLE, PATH, VIEW, MATERIALIZED_VIEW, METRIC_VIEW, STREAMING_TABLE)."
      - name: source_column_name
        type: TEXT
        description: "Name of the source column."
      - name: target_table_full_name
        type: TEXT
        description: "Three-part name of the target table."
      - name: target_table_catalog
        type: TEXT
        description: "Catalog of the target table."
      - name: target_table_schema
        type: TEXT
        description: "Schema of the target table."
      - name: target_table_name
        type: TEXT
        description: "Name of the target table."
      - name: target_path
        type: TEXT
        description: "Cloud storage path of the target object."
      - name: target_type
        type: TEXT
        description: "Type of the target object (TABLE, PATH, VIEW, etc.)."
      - name: target_column_name
        type: TEXT
        description: "Name of the target column."
      - name: created_by
        type: TEXT
        description: "User or service principal that generated this lineage record."
      - name: event_time
        type: TIMESTAMP
        description: "Timestamp when the column lineage event was generated."
      - name: event_date
        type: TEXT
        description: "Date when the lineage event was generated."
      - name: record_id
        type: TEXT
        description: "Unique ID of the column lineage record."
      - name: event_id
        type: TEXT
        description: "Unique ID for a single lineage event (shared by multiple rows from the same event)."
      - name: statement_id
        type: TEXT
        description: "ID of the query statement generating this lineage event; join key to query history."
      - name: entity_metadata
        type: TEXT
        description: "Serialized struct with metadata about entities responsible for the event (jobs, notebooks, pipelines, etc.)."

  - name: endpoint_usage
    description: "Fact table of model serving endpoint usage, including token/character counts and usage_context for cost attribution."
    columns:
      - name: account_id
        type: TEXT
        description: "Customer account ID."
      - name: workspace_id
        type: TEXT
        description: "Workspace ID of the serving endpoint."
      - name: client_request_id
        type: TEXT
        description: "User-provided request identifier in the serving request body."
      - name: databricks_request_id
        type: TEXT
        description: "Databricks-generated request identifier attached to all model serving requests."
      - name: requester
        type: TEXT
        description: "User/service principal whose permissions were used for the invocation."
      - name: status_code
        type: INTEGER
        description: "HTTP status code returned by the model."
      - name: request_time
        type: TIMESTAMP
        description: "Timestamp when the request was received."
      - name: input_token_count
        type: INTEGER
        description: "Token count of the input (0 for custom models)."
      - name: output_token_count
        type: INTEGER
        description: "Token count of the output (0 for custom models)."
      - name: input_character_count
        type: INTEGER
        description: "Character count of input (0 for custom models)."
      - name: output_character_count
        type: INTEGER
        description: "Character count of output (0 for custom models)."
      - name: usage_context
        type: TEXT
        description: "Serialized map (e.g. JSON) of user-provided identifiers such as project, end_user_to_charge, A/B test group."
      - name: request_streaming
        type: BOOLEAN
        description: "Whether the request was in streaming mode."
      - name: served_entity_id
        type: TEXT
        description: "ID joining to served_entities to look up endpoint and served entity."

  - name: experiments_latest
    description: "Latest state of MLflow experiments, including creation, update, and soft-delete times per workspace."
    columns:
      - name: account_id
        type: TEXT
        description: "ID of the account containing the MLflow experiment."
      - name: update_time
        type: TIMESTAMP
        description: "System time when the experiment was last updated."
      - name: delete_time
        type: TIMESTAMP
        description: "System time when the experiment was soft-deleted (NULL if not)."
      - name: experiment_id
        type: TEXT
        description: "ID of the MLflow experiment."
      - name: workspace_id
        type: TEXT
        description: "ID of the workspace containing the experiment."
      - name: name
        type: TEXT
        description: "User-provided name of the experiment (path-like)."
      - name: create_time
        type: TIMESTAMP
        description: "System time when the experiment was created."

  - name: history
    description: "Query history for SQL warehouses and serverless compute across workspaces, including performance metrics and statement metadata."
    columns:
      - name: account_id
        type: TEXT
        description: "ID of the account."
      - name: workspace_id
        type: TEXT
        description: "ID of the workspace where the query ran."
      - name: statement_id
        type: TEXT
        description: "Unique ID of the statement execution."
      - name: session_id
        type: TEXT
        description: "Spark session ID."
      - name: execution_status
        type: TEXT
        description: "Termination state (FINISHED, FAILED, CANCELED)."
      - name: compute
        type: TEXT
        description: "Serialized struct describing compute (type WAREHOUSE/SERVERLESS_COMPUTE, IDs)."
      - name: executed_by_user_id
        type: TEXT
        description: "ID of the user who ran the statement."
      - name: executed_by
        type: TEXT
        description: "Email/username of the user who ran the statement."
      - name: statement_text
        type: TEXT
        description: "SQL text of the statement (may be empty or compressed)."
      - name: statement_type
        type: TEXT
        description: "Statement type (SELECT, INSERT, ALTER, etc.)."
      - name: error_message
        type: TEXT
        description: "Error message if execution failed."
      - name: client_application
        type: TEXT
        description: "Client application (Databricks SQL Editor, Tableau, etc.)."
      - name: client_driver
        type: TEXT
        description: "Connector/driver used (ODBC, JDBC, etc.)."
      - name: cache_origin_statement_id
        type: TEXT
        description: "Statement ID of the query that populated the result cache, or itself if not cached."
      - name: total_duration_ms
        type: INTEGER
        description: "Total execution time in ms (excluding fetch)."
      - name: waiting_for_compute_duration_ms
        type: INTEGER
        description: "Time spent waiting for compute in ms."
      - name: waiting_at_capacity_duration_ms
        type: INTEGER
        description: "Time spent waiting in queue for capacity in ms."
      - name: execution_duration_ms
        type: INTEGER
        description: "Time spent executing the statement in ms."
      - name: compilation_duration_ms
        type: INTEGER
        description: "Time spent loading metadata and optimizing in ms."
      - name: total_task_duration_ms
        type: INTEGER
        description: "Sum of all task durations in ms across all cores/nodes."
      - name: result_fetch_duration_ms
        type: INTEGER
        description: "Time spent fetching results in ms."
      - name: start_time
        type: TIMESTAMP
        description: "Time when Databricks received the request."
      - name: end_time
        type: TIMESTAMP
        description: "Time when execution ended (excluding fetch)."
      - name: update_time
        type: TIMESTAMP
        description: "Time when the statement last received a progress update."
      - name: read_partitions
        type: INTEGER
        description: "Number of partitions read after pruning."
      - name: pruned_files
        type: INTEGER
        description: "Number of pruned files."
      - name: read_files
        type: INTEGER
        description: "Number of files read after pruning."
      - name: read_rows
        type: INTEGER
        description: "Total number of rows read."
      - name: produced_rows
        type: INTEGER
        description: "Total number of rows returned."
      - name: read_bytes
        type: INTEGER
        description: "Total size of data read in bytes."
      - name: read_io_cache_percent
        type: INTEGER
        description: "Percentage of bytes read from IO cache."
      - name: from_result_cache
        type: BOOLEAN
        description: "TRUE if result was fetched from result cache."
      - name: spilled_local_bytes
        type: INTEGER
        description: "Bytes temporarily written to disk."
      - name: written_bytes
        type: INTEGER
        description: "Bytes written to storage."
      - name: written_rows
        type: INTEGER
        description: "Rows written to storage."
      - name: written_files
        type: INTEGER
        description: "Files written to storage."
      - name: shuffle_read_bytes
        type: INTEGER
        description: "Bytes of shuffle data read over the network."
      - name: query_source
        type: TEXT
        description: "Serialized struct of Databricks entities triggering the statement (alerts, dashboards, notebooks, jobs, genie space, etc.)."
      - name: query_parameters
        type: TEXT
        description: "Serialized struct of named/positional parameters."
      - name: executed_as
        type: TEXT
        description: "User/service principal whose privileges were used."
      - name: executed_as_user_id
        type: TEXT
        description: "ID of the user/service principal whose privileges were used."

  - name: job_run_timeline
    description: "Immutable timeline of job runs, sliced into time intervals, with run type, trigger, and outcome metadata."
    columns:
      - name: account_id
        type: TEXT
        description: "ID of the account this job belongs to."
      - name: workspace_id
        type: TEXT
        description: "ID of the workspace this job belongs to."
      - name: job_id
        type: TEXT
        description: "ID of the job."
      - name: run_id
        type: TEXT
        description: "ID of the job run."
      - name: period_start_time
        type: TIMESTAMP
        description: "Start time for the run or slice (UTC)."
      - name: period_end_time
        type: TIMESTAMP
        description: "End time for the run or slice (UTC)."
      - name: trigger_type
        type: TEXT
        description: "Trigger type for the run (CONTINUOUS, CRON, FILE_ARRIVAL, ONETIME, etc.)."
      - name: run_type
        type: TEXT
        description: "Type of job run (JOB_RUN, SUBMIT_RUN, WORKFLOW_RUN)."
      - name: run_name
        type: TEXT
        description: "User-supplied run name."
      - name: compute_ids
        type: TEXT
        description: "Serialized array of job compute IDs for the run."
      - name: result_state
        type: TEXT
        description: "Outcome of the job run (SUCCEEDED, FAILED, etc.; NULL on intermediate slices)."
      - name: termination_code
        type: TEXT
        description: "Termination code describing why the run ended."
      - name: job_parameters
        type: TEXT
        description: "Serialized map of job-level parameters used in the run."
      - name: source_task_run_id
        type: TEXT
        description: "ID of the source task run that triggered this job run."
      - name: root_task_run_id
        type: TEXT
        description: "ID of the root task run that triggered this job run."
      - name: compute
        type: TEXT
        description: "Serialized array describing compute resources used."
      - name: termination_type
        type: TEXT
        description: "Type of termination for the run."
      - name: setup_duration_seconds
        type: INTEGER
        description: "Setup phase duration in seconds."
      - name: queue_duration_seconds
        type: INTEGER
        description: "Queue time duration in seconds."
      - name: run_duration_seconds
        type: INTEGER
        description: "Total job run duration in seconds."
      - name: cleanup_duration_seconds
        type: INTEGER
        description: "Cleanup phase duration in seconds."
      - name: execution_duration_seconds
        type: INTEGER
        description: "Execution phase duration in seconds."

  - name: job_task_run_timeline
    description: "Immutable timeline of job task runs, sliced into time intervals with compute and termination metadata."
    columns:
      - name: account_id
        type: TEXT
        description: "ID of the account this job belongs to."
      - name: workspace_id
        type: TEXT
        description: "ID of the workspace this job belongs to."
      - name: job_id
        type: TEXT
        description: "ID of the job."
      - name: run_id
        type: TEXT
        description: "ID of the task run."
      - name: job_run_id
        type: TEXT
        description: "ID of the parent job run."
      - name: parent_run_id
        type: TEXT
        description: "ID of the parent run."
      - name: period_start_time
        type: TIMESTAMP
        description: "Start time for the task or slice (UTC)."
      - name: period_end_time
        type: TIMESTAMP
        description: "End time for the task or slice (UTC)."
      - name: task_key
        type: TEXT
        description: "Reference key for the task in the job."
      - name: compute_ids
        type: TEXT
        description: "Serialized array of compute IDs associated with the task run."
      - name: result_state
        type: TEXT
        description: "Outcome of the task run (SUCCEEDED, FAILED, etc.; NULL for intermediate slices)."
      - name: termination_code
        type: TEXT
        description: "Termination code for the task run."
      - name: compute
        type: TEXT
        description: "Serialized array describing compute resources used."
      - name: termination_type
        type: TEXT
        description: "Type of termination for the task run."
      - name: task_parameters
        type: TEXT
        description: "Serialized map of task-level parameters used."
      - name: setup_duration_seconds
        type: INTEGER
        description: "Setup phase duration in seconds for the task."
      - name: cleanup_duration_seconds
        type: INTEGER
        description: "Cleanup phase duration in seconds for the task."
      - name: execution_duration_seconds
        type: INTEGER
        description: "Execution phase duration in seconds for the task."

  - name: job_tasks
    description: "Slow-changing dimension (SCD2) of job tasks and their configuration."
    columns:
      - name: account_id
        type: TEXT
        description: "ID of the account this job belongs to."
      - name: workspace_id
        type: TEXT
        description: "ID of the workspace this job belongs to."
      - name: job_id
        type: TEXT
        description: "ID of the job."
      - name: task_key
        type: TEXT
        description: "Reference key for a task in the job."
      - name: depends_on_keys
        type: TEXT
        description: "Serialized array of task_keys for upstream dependencies."
      - name: change_time
        type: TIMESTAMP
        description: "Time when the task was last modified."
      - name: delete_time
        type: TIMESTAMP
        description: "Time when the task was deleted."
      - name: timeout_seconds
        type: INTEGER
        description: "Timeout duration for the task in seconds."
      - name: health_rules
        type: TEXT
        description: "Serialized array of health rules for this task."

  - name: jobs
    description: "Slow-changing dimension (SCD2) of job configurations and metadata."
    columns:
      - name: account_id
        type: TEXT
        description: "ID of the account this job belongs to."
      - name: workspace_id
        type: TEXT
        description: "ID of the workspace this job belongs to."
      - name: job_id
        type: TEXT
        description: "ID of the job (unique within a workspace)."
      - name: name
        type: TEXT
        description: "User-supplied job name."
      - name: description
        type: TEXT
        description: "User-supplied job description."
      - name: creator_id
        type: TEXT
        description: "ID of the principal who created the job."
      - name: tags
        type: TEXT
        description: "Serialized map of user-supplied tags."
      - name: change_time
        type: TIMESTAMP
        description: "Time when the job was last modified."
      - name: delete_time
        type: TIMESTAMP
        description: "Time when the job was deleted."
      - name: run_as
        type: TEXT
        description: "ID of user/service principal whose permissions are used for the job."
      - name: trigger
        type: TEXT
        description: "Serialized trigger configuration."
      - name: trigger_type
        type: TEXT
        description: "Trigger type (CRON, FILE_ARRIVAL, ONETIME, etc.)."
      - name: run_as_user_name
        type: TEXT
        description: "Email or ID of the user/service principal whose permissions are used for job runs."
      - name: creator_user_name
        type: TEXT
        description: "Email or ID of the user/service principal who created the job."
      - name: paused
        type: BOOLEAN
        description: "Flag indicating whether the job is paused."
      - name: timeout_seconds
        type: INTEGER
        description: "Timeout in seconds for the job."
      - name: health_rules
        type: TEXT
        description: "Serialized array of health rules defined for this job."
      - name: deployment
        type: TEXT
        description: "Serialized deployment info for externally managed jobs."
      - name: create_time
        type: TIMESTAMP
        description: "Time when the job was created."

  - name: list_price
    description: "Historical log of SKU pricing changes, including list and promotional prices."
    columns:
      - name: price_start_time
        type: TIMESTAMP
        description: "Time when this price became effective (UTC)."
      - name: price_end_time
        type: TIMESTAMP
        description: "Time when this price stopped being effective (UTC) or NULL if still active."
      - name: account_id
        type: TEXT
        description: "ID of the account this pricing record applies to."
      - name: sku_name
        type: TEXT
        description: "Name of the SKU."
      - name: cloud
        type: TEXT
        description: "Cloud provider (AWS, AZURE, GCP)."
      - name: currency_code
        type: TEXT
        description: "Currency code (e.g. USD)."
      - name: usage_unit
        type: TEXT
        description: "Unit of measurement that is monetized (e.g. DBU)."
      - name: pricing
        type: TEXT
        description: "Serialized struct describing default, promotional, and effective list prices."

  - name: node_timeline
    description: "Minute-by-minute node-level resource utilization metrics per instance for compute clusters."
    columns:
      - name: account_id
        type: TEXT
        description: "ID of the account where the compute resource is running."
      - name: workspace_id
        type: TEXT
        description: "ID of the workspace where the compute resource is running."
      - name: cluster_id
        type: TEXT
        description: "ID of the compute resource (cluster)."
      - name: instance_id
        type: TEXT
        description: "ID of the specific instance."
      - name: start_time
        type: TIMESTAMP
        description: "Start time of the metric interval (UTC)."
      - name: end_time
        type: TIMESTAMP
        description: "End time of the metric interval (UTC)."
      - name: driver
        type: BOOLEAN
        description: "TRUE if the instance is the driver node."
      - name: cpu_user_percent
        type: REAL
        description: "Percentage of time CPU spent in userland."
      - name: cpu_system_percent
        type: REAL
        description: "Percentage of time CPU spent in kernel mode."
      - name: cpu_wait_percent
        type: REAL
        description: "Percentage of time CPU waited for I/O."
      - name: mem_used_percent
        type: REAL
        description: "Percentage of memory used during the period."
      - name: mem_swap_percent
        type: REAL
        description: "Percentage of memory usage attributed to swap."
      - name: network_sent_bytes
        type: INTEGER
        description: "Bytes sent in network traffic during the period."
      - name: network_received_bytes
        type: INTEGER
        description: "Bytes received in network traffic during the period."
      - name: disk_free_bytes_per_mount_point
        type: TEXT
        description: "Serialized map of disk free bytes per mount point."
      - name: node_type
        type: TEXT
        description: "Node type (matches instance type name from cloud provider)."

  - name: node_types
    description: "Available node types with their hardware characteristics."
    columns:
      - name: account_id
        type: TEXT
        description: "ID of the account where this node type is available."
      - name: node_type
        type: TEXT
        description: "Unique identifier for the node type (instance type)."
      - name: core_count
        type: REAL
        description: "Number of vCPUs."
      - name: memory_mb
        type: INTEGER
        description: "Total memory in MB."
      - name: gpu_count
        type: INTEGER
        description: "Number of GPUs."

